<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>The Bermuda Disappearance</title>
</head>
<body>
    <div id="viewport">
        <div id="main">
            <label class="titles" id="location-name">Blackbox Analyzation Lab</label>
            <div id="viewframe">
                <img id="viewframe-image" src="https://media.abc10.com/assets/CCT/images/b5004f53-6c3c-4bf3-ae7a-9e7374d9e2a9/20250131T122520/b5004f53-6c3c-4bf3-ae7a-9e7374d9e2a9_1920x1080.jpg"></img>
            </div>
        </div>
        <div id="inventory">
            <label class="titles">Inventory</label>
            <div id="flex-layout">
                <div class="items">
                    <image class="itemimages" src="placeholder"></image>
                    <label class="itemlabels">Item</label>
                </div>
            </div>
        </div>
        <div id="interaction">
            <div id="dialog-context-box">
                <label id="dialog-context-label">I don't feel like I belong here. In spite of this feeling, the crash analysts ask me to turn in the blackbox.</label>
            </div>
            <a href="hospital.html"><button class="choicebuttons" id="accept">Accept</button></a>
            <a href="fail.html"><button class="choicebuttons" id="decline">Decline</button></a>
        </div>
        <div id="stats">
            <label class="titles">Stats</label>
            <div id="stats-info">
                <div class="stat-info-box">
                    <label id="stat-label">Sleep</label>
                    <image id="stat-meter" src="placeholder"></image>
                </div>
                <div class="stat-info-box">
                    <label id="stat-label">Sanity</label>
                    <image id="stat-meter" src="placeholder"></image>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
