<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>The Bermuda Disappearance</title>
</head>
<body>
    <div id="viewport">
        <div id="main">
            <label class="titles" id="location-name">Hospital</label>
            <div id="viewframe">
                <img id="viewframe-image" src="https://www.hfmmagazine.com/sites/default/files/hfmmagazine/ext/resources/images/2016/October/1116_upfront_microhospital_BSW.jpg"></img>
            </div>
        </div>
        <div id="inventory">
            <label class="titles">Inventory</label>
            <div id="flex-layout">
                <div class="items" id="temp">
                    <image class="itemimages" src="placeholder"></image>
                    <label class="itemlabels">Item</label>
                </div>
            </div>
        </div>
        <div id="interaction">
            <div id="dialog-context-box">
                <label id="dialog-context-label">There’s no way that could’ve been a dream. I kinda suspected it, but it's still shocking to me.</label>
            </div>
            <a href="ending.html"><button class="choicebuttons" id="accept">Accept</button></a>
            <a href="ending.html"><button class="choicebuttons" id="decline">Decline</button></a>
        </div>
        <div id="stats">
            <label class="titles">Stats</label>
           <div id="stats-info">
                <div class="stat-info-box">
                    <label class="stat-label">Sleep</label>
                    <div class="stat-meter">
                        <label id="sleep-value">100 / 100</label>
                    </div>
                </div>
                <div class="stat-info-box">
                    <label class="stat-label">Sanity</label>
                    <div class="stat-meter">
                        <label id="sanity-value">100 / 100</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./game.js"></script>
</body>
</html>
