<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>The Bermuda Disappearance</title>
</head>
<body>
    <div id="viewport">
        <div id="main">
            <label class="titles" id="location-name">Hotel</label>
            <div id="viewframe">
                <img id="viewframe-image" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Fontainebleau_Miami_Beach_Aerial_2025.jpg/1280px-Fontainebleau_Miami_Beach_Aerial_2025.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail"></img>
            </div>
        </div>
        <div id="inventory">
            <label class="titles">Inventory</label>
            <div id="flex-layout">
                <div class="items">
                    <image class="itemimages" src="placeholder"></image>
                    <label class="itemlabels">Item</label>
                </div>
            </div>
        </div>
        <div id="interaction">
            <div id="dialog-context-box">
                <label id="dialog-context-label">The NPCIA insists on providing me with a hotel due to its ease of access to the dock where I'll set sail toward The Bermuda Triangle. When I was about to fall asleep, I heard some sounds coming from a room with a posted sign that reads "DO NOT ENTER". Do I want to find out what was creating that noise?</label>
            </div>
            <a href="fail.html"><button class="choicebuttons" id="accept">Accept</button></a>
            <a href="thebermudatriangle.html"><button class="choicebuttons" id="decline">Decline</button></a>
        </div>
        <div id="stats">
            <label class="titles">Stats</label>
            <div id="stats-info">
                <div class="stat-info-box">
                    <label id="stat-label">Sleep</label>
                    <image id="stat-meter" src="placeholder"></image>
                </div>
                <div class="stat-info-box">
                    <label id="stat-label">Sanity</label>
                    <image id="stat-meter" src="placeholder"></image>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
